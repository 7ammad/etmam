name: Etimad Scraper

# Runs the Etimad tender scraper and syncs data to the database.
#
# Schedule: Daily at 6 AM UTC (9 AM Saudi Arabia time)
# Manual: Can be triggered manually via workflow_dispatch

on:
  # NOTE: Scheduled runs are disabled until deployment is ready
  # Uncomment the schedule below after you've deployed and set up SCRAPER_API_URL secret
  # schedule:
  #   # Run daily at 6:00 AM UTC (9 AM Saudi Arabia time)
  #   - cron: '0 6 * * *'

  # Allow manual triggering (for testing)
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of tenders to scrape'
        required: false
        default: '50'
        type: string
      delay_ms:
        description: 'Delay between requests (ms)'
        required: false
        default: '2000'
        type: string

# Concurrency: Only one scraper run at a time
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape Etimad Tenders
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Max 30 minutes for scraping

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run scraper
        run: pnpm scrape:run
        env:
          API_URL: ${{ secrets.SCRAPER_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
          DELAY_MS: ${{ github.event.inputs.delay_ms || '2000' }}

      - name: Upload scraper logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: |
            scratchpad/etimad-recon/
          retention-days: 7
          if-no-files-found: ignore

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: scrape
    if: failure()

    steps:
      - name: Send failure notification
        # Add your preferred notification method here
        # Examples: Slack, Discord, email, etc.
        run: |
          echo "Scraper failed at $(date)"
          echo "Run: ${{ github.run_id }}"
          echo "Workflow: ${{ github.workflow }}"
          # Uncomment and configure for Slack notification:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"Etimad scraper failed! Run: ${{ github.run_id }}"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
